version: 0.2

env:
  variables:
    APP_ENV: "ci"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install -r requirements.txt
  pre_build:
    commands:
      - echo "Running unit tests"
      - pytest -v --junitxml=test-report.xml
  build:
    commands:
      - echo "Packaging application"
      - mkdir -p dist
      - cp app.py requirements.txt dist/
  post_build:
    commands:
      - echo "Build finished"

reports:
  pytest_reports:
    files:
      - test-report.xml
    file-format: JUNITXML

artifacts:
  files:
    - '**/*'
  base-directory: dist
